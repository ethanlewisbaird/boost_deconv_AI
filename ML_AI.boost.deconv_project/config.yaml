# Default config for ML_AI.boost.deconv
use_merged_sc: true
sc_paths:
  merged: "/data/ebaird/scRNAseq/SCENTINELsep24/hide_deconvolution/anndata.h5ad"
  libraries:
    - "data/sc/lib1_sc.h5ad"
    - "data/sc/lib2_sc.h5ad"

use_merged_bulk: true
bulk_paths:
  merged: "/data/vtheodorou/fastq/EnsemblBDGP6.46_Diff.paper/RNAseq/edgeR.featureCounts.2025.08.21/counts_final.tsv"
  individual:
    - "data/bulk/sample1.csv"
    - "data/bulk/sample2.csv"

microscopy_csv: "data/metadata/microscopy_counts.csv"

remove_mt_rpl: true
custom_gene_list: []

normalization_methods:
  - "log1p"
  - "scran"
  - "counts_per_million"

pseudo_bulk_samples: 500
augmentation_factor: 2.0

model_type: "xgboost"
hyperparameter_search: true

output_dir: "results/"
report_pdf: true
